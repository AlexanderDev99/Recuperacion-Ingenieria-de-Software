spring.application.name=membership-service

# Puerto de la aplicación (0 para puerto aleatorio, ideal con Eureka)
server.port=0

# --- CONFIGURACIÓN POSTGRESQL ---
# El host es 'membership-db' porque es el nombre del servicio en docker-compose
spring.datasource.url=jdbc:postgresql://membership-db:5432/membership_db
spring.datasource.username=redStak
spring.datasource.password=qu1Nch1nK
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- EUREKA CLIENT ---
eureka.client.service-url.defaultZone=http://discovery:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Configuración de instancia para Docker
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}